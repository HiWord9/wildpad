name: release

# Runs when a release is published (and by hand): builds and tests everything,
# attaches the zip to the release and puts the setup page with that firmware on
# GitHub Pages. Pre-releases get the zip but leave the website alone.
#
# The tag starts with the firmware version (firmware/src/config.h): v0.2.0 brings
# firmware 0.2.0, v0.2.0.1 keeps it and brings a newer page or tools. The build
# checks that against the previous release (tools/package.py --notes), and the
# release notes get a line saying which firmware the release carries.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write                  # attach the zip, add the firmware line
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # earlier releases, to compare the firmware with

      - name: Build and test, compare the firmware with the previous release
        run: RELEASE_TAG="$TAG" bash tools/ci.sh

      - name: Package
        run: |
          python3 tools/package.py ${TAG:+--release "$TAG"}
          python3 tools/package.py --site site ${TAG:+--release "$TAG"}

      - name: Attach the zip and the firmware line to the release
        if: github.event_name == 'release'
        run: |
          gh release upload "$TAG" dist/*.zip --clobber
          body="$(gh release view "$TAG" --json body -q .body)"
          case "$body" in
            *"**Firmware "*) ;;
            *) gh release edit "$TAG" --notes "$(cat .ci/firmware-note.md)"$'\n\n'"$body" ;;
          esac

      - if: github.event_name != 'release' || !github.event.release.prerelease
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: build
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
