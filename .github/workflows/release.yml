name: release

# Runs when a release is published (and by hand): builds and tests the firmware,
# attaches the zip to the release and puts the setup page with that firmware on
# GitHub Pages. The release tag must be the firmware version, e.g. v0.0.1.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write                  # attach the zip to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SDCC 4.5 (the version the firmware is sized for)
        run: |
          curl -fsSL -o sdcc.tar.bz2 \
            https://downloads.sourceforge.net/project/sdcc/sdcc-linux-amd64/4.5.0/sdcc-4.5.0-amd64-unknown-linux2.5.tar.bz2
          echo "3395722e3f8a31ce6a14c75fc419f586a3573b939f85efee5c88cdd35820a240  sdcc.tar.bz2" | sha256sum -c -
          tar xjf sdcc.tar.bz2
          echo "$PWD/sdcc-4.5.0/bin" >> "$GITHUB_PATH"

      - name: Version matches the tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(python3 tools/package.py --version)" = "$TAG"

      - name: Build
        run: python3 firmware/build.py
      - name: Descriptor checks
        run: python3 firmware/test/check_descriptors.py
      - name: Simulator tests
        run: python3 firmware/test/run_tests.py

      - name: Package
        run: |
          python3 tools/package.py
          python3 tools/package.py --site site

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
