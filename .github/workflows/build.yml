name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDCC
        run: sudo apt-get update && sudo apt-get install -y sdcc sdcc-ucsim
      - name: Build
        run: python3 firmware/build.py
      - name: Descriptor checks
        run: python3 firmware/test/check_descriptors.py
      - name: Simulator tests
        run: python3 firmware/test/run_tests.py
      - name: Package
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: detent
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
