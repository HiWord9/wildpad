name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # only used by the release step on tags
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install SDCC
        run: sudo apt-get update && sudo apt-get install -y sdcc sdcc-ucsim
      - name: Build
        run: python3 firmware/build.py
      - name: Descriptor checks
        run: python3 firmware/test/check_descriptors.py
      - name: Simulator tests
        run: python3 firmware/test/run_tests.py
      - name: Package
        run: python3 tools/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wildpad
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.zip
