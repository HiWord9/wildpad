name: test

# Every push to dev or main and every pull request: build the firmware and run all
# tests (tools/ci.sh).
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        run: bash tools/ci.sh
